    <section class="page-intro"><div class="shell page-intro__row"><div><p class="eyebrow">Anonymous ranking</p><h1 class="page-title">排行榜</h1><p class="page-lede">选择测试项目，查看近期匿名成绩。不同测试的计分方式不同，页面会明确标注“越高越好”或“越低越好”。</p></div><div class="page-index">#01</div></div></section>
    <section class="leaderboard-layout"><div class="shell">
      <div class="leaderboard-summary"><div class="summary-stat"><span>当前项目</span><strong>反应速度</strong></div><div class="summary-stat"><span>平均成绩</span><strong>247 ms</strong></div><div class="summary-stat"><span>有效样本</span><strong>1,284</strong></div></div>
